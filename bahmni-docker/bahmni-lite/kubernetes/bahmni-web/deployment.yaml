apiVersion: apps/v1
kind: Deployment
metadata:
  name: bahmni-web
  labels:
    app: bahmni-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bahmni-web
  template:
    metadata:
      labels:
        app: bahmni-web
    spec:
      initContainers:
        - name: wait-for-config
          image: busybox
          command: ['sh', '-c', 'until [ -f /usr/local/apache2/htdocs/bahmni_config/openmrs/apps/home/app.json ]; do echo "Waiting for config..."; sleep 2; done']
          volumeMounts:
            - name: shared-config-volume
              mountPath: /usr/local/apache2/htdocs/bahmni_config

      containers:
        - name: 779846789022.dkr.ecr.ap-south-1.amazonaws.com/bahmni-web:14.0.0
          image: 
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-config-volume
              mountPath: /usr/local/apache2/htdocs/bahmni_config

      volumes:
        - name: shared-config-volume
          persistentVolumeClaim:
            claimName: bahmni-config-pvc

      imagePullSecrets:
        - name: regcred
